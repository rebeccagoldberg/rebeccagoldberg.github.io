- quote: >-
    Rebecca has been a critical advisor for Playworks, particularly through exceptional thought
    partnership and strategic guidance focused on positioning our work within the youth development field. She
    has offered insight and a critical eye for public-facing materials, directly strengthening our ability to
    engage potential funding partners and broaden our reach. Rebecca's collaborative approach and deep
    commitment to building the conditions young people need to thrive make her an invaluable partner for any
    organization looking to deepen its impact.
  name: Elizabeth Cushing
  title: CEO, Playworks
- quote: >-
    Rebecca is the colleague you want in your corner: a strategist who sees the implications of
    decisions and spots what—or who—is missing. She brings a broad, deep understanding of philanthropy and youth
    development, and she is consistently dependable and collaborative. Most importantly, she is a trusted
    critical friend who speaks candidly in service of better outcomes for the project, the field, and
    ultimately, young people.
  name: Terri Ferinde
  title: Partner, Collaborative Communications
- quote: >-
   Rebecca is an exceptional leader, collaborator, and partnership builder. She thoughtfully navigates diverse perspectives and aligns stakeholders around a shared vision and common goals. Rebecca is professional, highly organized, and an authentic communicator who builds trust across teams and organizations. Her strategic thinking, coupled with her ability to foster collaboration, enables her to move complex initiatives forward effectively. I highly recommend her leadership and strategic guidance to other organizations and initiatives, particularly those seeking to unite diverse partners around a shared purpose.
  name: Deborah Moroney
  title: Vice President, American Institutes for Research
