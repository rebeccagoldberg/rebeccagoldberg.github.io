<section id="publications" data-screen-label="05 Publications">
  <div class="container">
    <div class="section-label reveal"><span class="num">05 —</span><span>Publications</span></div>
    <h2 class="section-title reveal">Writing &amp; contributions.</h2>
    <p class="section-intro reveal">
      Selected articles, chapters, and reports in philanthropy, social-emotional
      learning, and youth development.
    </p>

    <div class="pubs-list reveal">
      {% for pub in site.data.publications %}
      <a class="pub" href="{{ pub.href }}" target="_blank" rel="noreferrer">
        <div class="year">{{ pub.year }}</div>
        <div class="title">{{ pub.title }}<div class="venue">{{ pub.venue }}</div>
        </div>
        <div class="meta">{{ pub.type }} ↗</div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
