<section id="contact" class="tint-cream" data-screen-label="06 Contact">
  <div class="container">
    <div class="section-label reveal"><span class="num">06 —</span><span>Get in touch</span></div>

    <div class="contact-grid">
      <div class="reveal">
        <h2 class="contact-title">Ready to <em>partner?</em></h2>
        <p class="contact-lede">
          Tell me about the work you’re doing and where I might fit in.
        </p>

        <div class="contact-list">
          <button type="button" id="reveal-email" data-e="{{ site.contact_email_b64 }}"><span><span class="k">Email</span><span class="v">Show email address</span></span><span>↗</span></button>
          <a href="{{ site.social.linkedin }}" target="_blank" rel="noreferrer"><span><span class="k">LinkedIn</span>/in/rebeccamgoldberg</span><span>↗</span></a>
        </div>
        <noscript><p class="contact-note">The email address is hidden from spam bots and needs JavaScript. Please use the form.</p></noscript>
      </div>

      <form class="contact-form reveal" id="contact-form" action="{{ site.contact_form_action }}" method="POST"
        accept-charset="UTF-8">
        <h3>Send a message</h3>
        <p class="intro">A quick note about your project or question.</p>

        <label for="cf-name">Your name</label>
        <input id="cf-name" name="fullName" type="text" placeholder="Your Name" required>
        <label for="cf-email">Email</label>
        <input id="cf-email" name="email" type="email" placeholder="Your Email" required>
        <label for="cf-phone">Phone Number (optional)</label>
        <input id="cf-phone" name="phone" type="tel" placeholder="Your Phone">
        <label for="cf-msg">Message</label>
        <textarea id="cf-msg" name="message"
          placeholder="A little about the work and what you’re looking for…" required style="height: 150px;"></textarea>
        <input type="hidden" name="_gotcha">
        <input type="hidden" name="redirect" value="{{ site.url }}{{ site.baseurl }}?sent=true#contact">
        <button class="submit" type="submit">Send message →</button>
        <div class="sent" id="cf-sent" role="status"></div>
      </form>
    </div>
  </div>
</section>
